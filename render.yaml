services:
  - type: web
    name: donaciones-donde-hacen-falta
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: DEMO_AUTH
        value: "false"
      - key: SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: donaciones-postgres
          property: connectionString
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: COORDINATOR_EMAIL
        sync: false
databases:
  - name: donaciones-postgres
    plan: free
    region: oregon
    databaseName: donaciones
    user: donaciones
    ipAllowList: []
